version: '3.8'
services:
  app:
    image: python3.12:dev
    container_name: ${CONTAINER_NAME}
    ports:
      - "${HOST_PORT}:8000"
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command: sleep infinity
    networks:
      - python-dev-network
      - ollama-network
      - store_network
      - vllm-network
      - langfuse-network

networks:
  python-dev-network:
    name: python-dev-network
    driver: bridge
  ollama-network:
  store_network:
  vllm-network:
  langfuse-network:
