# LLMモデル設定ファイル
# 複数のLLMとそのパラメータを定義

llm_config_models:
  # Ollama系 (ローカル推論)
  ollama_qwen3_8b:
    backend: "ollama"
    model_name: "qwen3:8b"
    base_url: "http://ollama:11434"
 
  # vLLM (GPU推論サーバー)
  vllm_qwen3_32b_awq:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-32B-AWQ"
    base_url: "http://vllm-llm:8000/v1"

  vllm_qwen3_vl_30b:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-VL-30B-A3B-Instruct"
    base_url: "http://vllm-llm:8000/v1"
  
  vllm_elyza_8b:
    backend: "vllm"
    model_name: "/models/Llama-3-ELYZA-JP-8B"
    base_url: "http://vllm-llm:8000/v1"

  vllm_elyza_8b_awq:
    backend: "vllm"
    model_name: "/models/Llama-3-ELYZA-JP-8B-AWQ"
    base_url: "http://vllm-llm:8000/v1"

llm_domain_kwargs_models:
  default:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0

  # ==========================================
  # Extractor系
  # ==========================================

  # TitleExtractor - タイトル生成（短く簡潔に）
  extractor_title:
    temperature: 0.0
    max_tokens: 100
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0  # 繰り返し抑制
      frequency_penalty: 1.0  # 頻出抑制
      stop: ["\n"]  # 改行で停止

  # SummaryExtractor - 要約生成（適度な長さ）
  extractor_summary:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0
      frequency_penalty: 1.0

  # KeywordExtractor - キーワード抽出（短く）
  extractor_keyword:
    temperature: 0.0
    max_tokens: 256
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0
      frequency_penalty: 1.0
      stop: ["\n"]

  # QuestionsAnsweredExtractor - 質問生成
  extractor_qa:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0
      frequency_penalty: 1.0

  # ==========================================
  # Selector系
  # ==========================================

  # LLMSingleSelector / LLMMultiSelector - 単一選択 / 複数選択
  selector:
    temperature: 0.0
    max_tokens: 256
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0


  # ==========================================
  # Response Synthesizer系
  # ==========================================

  # ResponseSynthesizer - 回答生成（標準）
  synthesizer_response:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0

  # TreeSummarize - 階層的要約
  synthesizer_tree_summarize:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.5  # 軽い繰り返し抑制
      frequency_penalty: 0.5

  # Refine - 段階的改善
  synthesizer_refine:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.3
      frequency_penalty: 0.3

  # ==========================================
  # Index別の設定
  # ==========================================
  # VectorStoreIndex - ベクトル検索ベース（標準的な回答生成）
  index_vector_store:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0

  # SummaryIndex - 要約ベース（全体を見渡す必要がある）
  index_summary:
    temperature: 0.0
    max_tokens: 2048
    timeout: 300
    additional_kwargs:
      presence_penalty: 0.3
      frequency_penalty: 0.3

  # TreeIndex - 階層的検索（構造化された回答）
  index_tree:
    temperature: 0.0
    max_tokens: 1536
    timeout: 240
    additional_kwargs:
      presence_penalty: 0.2
      frequency_penalty: 0.2

  # KeywordTableIndex - キーワード検索ベース（簡潔な回答）
  index_keyword_table:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.5
      frequency_penalty: 0.5
      stop: ["\n\n"]

  # KnowledgeGraphIndex - 知識グラフベース（関連性重視）
  index_knowledge_graph:
    temperature: 0.1
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0

  # DocumentSummaryIndex - ドキュメント要約ベース
  index_document_summary:
    temperature: 0.0
    max_tokens: 1536
    timeout: 240
    additional_kwargs:
      presence_penalty: 0.3
      frequency_penalty: 0.3

  # ==========================================
  # Query Engine別の設定
  # ==========================================

  # RouterQueryEngine用のメタ判断（どのインデックスを使うか）
  query_engine_router_selector:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0
      stop: ["\n"]

  # SubQuestionQueryEngine - サブクエリ生成
  query_engine_sub_question:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.5
      frequency_penalty: 0.5

  # RetrieverQueryEngine - 基本的な検索＋生成
  query_engine_retriever:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0

  # MultiStepQueryEngine - 複数ステップの推論
  query_engine_multi_step:
    temperature: 0.1
    max_tokens: 1536
    timeout: 240
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0
