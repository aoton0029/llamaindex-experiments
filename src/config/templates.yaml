    #   3. 回答は選択した番号（整数）のみ。説明・記号・改行は一切不要
      
    #   # 例
    #   質問：Pythonのリスト操作について教えて
    #   選択肢：
    #   1. Python基礎文法ガイド - Pythonの基本的な文法と構文を解説
    #   2. データ構造とアルゴリズム - リスト、辞書、セットなどのデータ構造の詳細
    #   3. Web開発フレームワーク - Django、Flaskなどのフレームワーク解説
    #   回答：2


    #   質問：{query_str}
    #   選択肢：{context_list}
    #   回答：

    jp_single_select_tmpl: |
      あなたは高度な情報検索システムのクエリルーターです。
      質問を分析し、最も適切な情報源を1つだけ選択する専門家です。
      以下の指示に厳密に従ってください。

      # 指示
      1. 質問を分析し、最も適切な情報源を「一つだけ」選べ
      2. 質問の主要なトピックと最も関連性が高い選択肢を選べ
      3. 複数該当する場合は、より具体的で詳細な情報源を優先
      4. どれも該当しない場合は、最も一般的な選択肢を選べ
      3. 回答は選択した番号（整数）のみ。説明・記号・改行は一切不要
      
      # 例
      質問：Pythonのリスト操作について教えて
      選択肢：
      1. Python基礎文法ガイド - Pythonの基本的な文法と構文を解説
      2. データ構造とアルゴリズム - リスト、辞書、セットなどのデータ構造の詳細
      3. Web開発フレームワーク - Django、Flaskなどのフレームワーク解説
      回答：2


      質問：{query_str}
      選択肢：{context_list}
      回答：
    
    jp_multi_select_tmpl: |
      あなたは情報検索システムのマルチクエリルーターです。
      質問を分析し、適切な情報源を複数選択する専門家です。
      以下の指示に厳密に従ってください。

      # 指示
      1. 質問を分析し、適切な情報源を**複数（0個、1個または複数個）**選択せよ
      2. 関連性が高い順に番号を並べる（最も関連性が高いものを最初に）
      3. 関連性が低いまたは無関係な選択肢は含めない
      4. 選択可能な番号範囲：1～{num_choices}
      5. 最大{max_outputs}個まで選択可能（超えないこと）
      6. 回答は選択した番号をカンマ区切りで並べる（例：2,1,4）
      7. 該当なしの場合は「なし」と回答
      8. 説明・記号。改行は一切不要

      # 例
      質問：Pythonでのデータ分析について教えて
      選択肢：
      1. Python基礎文法ガイド - Pythonの基本的な文法と構文を解説
      2. データ分析ライブラリ - pandas、numpy、matplotlibの使い方
      3. 機械学習入門 - scikit-learnを使った機械学習の基礎
      4. Web開発フレームワーク - Django、Flaskなどのフレームワーク解説
      回答：2,3,1


      質問：{query_str}
      選択肢：{context_list}
      回答：


  # Extractor Templates
  extractor:
    jp_title_node_template_tmpl: |
      あなたは与えられた日本語テキストから「最適なタイトル」を抽出・生成するモデルです。
      以下の指示に厳密に従ってください。

      # 指示
      1. テキストから適切なタイトルを生成せよ
      2. 説明や補足、改行、注釈は一切付けず、「タイトル文字列のみ」にせよ
      3. 文字数上限は30文字（必要なら変更可）
      4. 専門用語・固有名詞・日付・数字は可能な限り保持せよ
      5. テキストが短くタイトルとして十分なら、そのまま返せ
      6. 「タイトル：」、「---」を出力に含めるな
      
      # 例
      テキスト：2025年版の機械学習入門：基本概念から実践までを丁寧に解説。Pythonでの実装例も掲載。
      タイトル：機械学習入門


      テキスト：{context_str}
      タイトル：


    jp_title_combine_template_tmpl: |
      あなたは複数の文書タイトルを分析し、その本質を捉えた統合タイトルを生成する専門家です。
      以下の指示に厳密に従ってください。

      # 指示
      1. タイトル一覧を統合し、全体を代表する1つのタイトルを生成せよ
      2. 説明や補足、改行、注釈は一切付けず、「タイトル文字列のみ」にせよ
      3. 文字数上限は30文字(必要なら変更可)。上限を超える場合は重要語を優先して短縮せよ
      4. テキストの主要なトピックや主題を簡潔に表現せよ
      5. 日本語として自然で読みやすい表現にせよ
      6. 専門用語・固有名詞・日付・数字は必ず保持せよ
      7. 「について」「に関する」のような冗長な表現は避けよ
      8. 「統合タイトル：」、「---」を出力に含めるな
      
      # 例
      タイトル一覧：
      - Pythonによるデータ分析の基礎
      - pandas入門ガイド
      - NumPyを使った数値計算
      統合タイトル：Pythonデータ分析ツールの基礎
      

      タイトル一覧：{context_str}
      統合タイトル：


    jp_summary_extract_template_tmpl: |
      あなたは日本語テキストを簡潔かつ正確に要約するモデルです。
      以下の指示に厳密に従ってください。

      # 指示
      1. テキストから要約文を生成せよ
      1. 説明や補足、改行、注釈は一切付けず、「要約文のみ」にせよ
      2. 長さは「1～3文(300文字)」
      3. 専門用語、固有名詞、日付、数字、重要な事実は可能な限り保持せよ
      4. 主観的評価、推測、未確認情報の追加は禁止。テキストにない事実を付け加えるな
      5. テキストが短く、要約が不要な場合はそのまま返せ
      6. 日本語以外が混在する場合でも、日本語で完結に要約せよ
      7. 「要約：」、「---」を出力に含めるな
      
      # 例
      テキスト：2025年版の機械学習入門：基本概念から実践までを丁寧に解説。Pythonでの実装例も掲載
      要約：2025年版の機械学習入門は、基本概念と実践（Python実装例）を丁寧に解説する。
      

      テキスト：{context_str}
      要約：


    jp_keyword_extract_template_tmpl: |
      あなたは与えられた日本語テキストから「重要キーワード」を抽出し、半角カンマで区切って返すモデルです。
      以下の指示に厳密に従ってください。

      # 指示
      1. テキストから重要なキーワードを抽出せよ
      1. 説明や補足、改行、注釈は一切付けず、「キーワードのみ」を半角カンマ区切りで返せ
      2. 最大{keywords}個まで
      3. 助詞、接続詞、一般的な補助語は除外せよ
      4. 専門用語・固有名詞・日付・数字はできる限り保持せよ
      5. テキストが短くキーワードが1つしかない場合はその1つだけ返せ
      6. カンマ区切りで出力する（例: k1,k2,k3）
      7. 「キーワード：」、「---」を出力に含めるな
      
      # 例
      テキスト：2025年版 機械学習入門:基本概念とPython実装のハンズオン
      キーワード：機械学習,2025,Python,ハンズオン,基本概念


      テキスト：{context_str}
      キーワード：

    jp_question_gen_tmpl: |
      あなたは与えられたテキストから質問を生成する専門家です。
      以下の指示に厳密に従ってください。
      
      # 指示
      1. テキストから質問を{num_questions}件生成せよ
      2. テキストから直接回答できる質問を作成せよ
      3. 専門用語・固有名詞・日付・数字はできる限り保持せよ
      4. 他の文書では回答しにくい、このテキスト特有の質問にせよ
      5. 「質問文：」を質問文に含めるな
      
      # 例
      テキスト：
      質問文：
      1. <質問文>
      2. <質問文>
      3. <質問文>


      テキスト：{context_str}
      質問文：
      

  # Evaluation Templates
  evaluation:
    jp_question_generation_prompt: |
      以下のコンテキストから質問を生成してください。
      
      【コンテキスト】
      {context_str}
      
      【生成要件】
      - コンテキストから直接回答できる質問を作成する
      - 具体的で明確な表現を使用する
      - 事実確認、理由説明、比較、評価など多様な観点を含める
      - 外部知識を必要としない質問にする
      
      【出力指示】
      質問:{query_str}
    
    jp_question_gen_query: |
      与えられた文書から理解度を測るための質問を3個生成してください。
      
      【生成要件】
      - コンテキストに含まれる具体的な情報に基づく
      - コンテキストから直接回答できる質問である
      - 明確で曖昧さのない表現を使用する
      - 外部知識を必要としない
      - 事実確認、理由説明、比較、評価など多様な観点を含める
      
      【出力形式】
      1.<質問文>
      2.<質問文>
      3.<質問文>
    
    jp_eval_template_tmpl: |
      以下の情報がコンテキストによって支持されているかを判断してください。
      
      【判断基準】
      - コンテキストに情報の根拠が含まれている場合は YES
      - コンテキストに情報の根拠が含まれていない場合は NO
      - コンテキストの一部でも情報を支持していれば YES
      - 大部分が無関係でも、一部が支持していれば YES
      
      【評価対象の情報】
      {query_str}
      
      【コンテキスト】
      {context_str}
      
      【出力形式】
      YES または NO のいずれかで回答してください。
      
      回答: 

    jp_refine_template_tmpl: |
      既存の評価結果を、追加コンテキストを用いて更新してください。
      
      【評価対象の情報】
      {query_str}
      
      【既存の評価結果】
      {existing_answer}
      
      【追加コンテキスト】
      {context_msg}
      
      【更新基準】
      - 既存評価が YES の場合は YES を維持する
      - 追加コンテキストに情報の根拠があれば YES
      - 追加コンテキストに情報の根拠がなければ既存評価を維持
      - 矛盾がある場合は追加コンテキストを優先する
      
      【出力形式】
      YES または NO のいずれかで回答してください。
      
      更新後の回答: 
    
    jp_summary_query: |
      ドキュメントを分析し、包括的な要約を作成してください。

      # 分析項目
      1. 主要な内容とテーマ
        - ドキュメントの中心的なトピック
        - 扱われている主題や概念
      2. 目的と意図
        - このドキュメントが作成された目的
        - 想定される読者層
      3. 重要な情報
        - キーポイントや重要な事実
        - 具体的なデータや数値
        - 特筆すべき地検や結論
      4. 質問への回答可能性
        - このドキュメントで回答できる質問の例
        - カバーされている情報の範囲

      # 要件
      - 簡潔かつ網羅的にまとめること
      - 箇条書きを活用して読みやすくすること
      - 重要度の高い情報を優先すること

    
    jp_summary_prompt_tmpl: |
      あなたは正確かつ簡潔な要約を生成する専門家です。
      以下の指示に厳密に従ってください。
      
      # 指示
      1. テキストの主要な情報を漏らさず要約文を生成せよ
      2. 3～5文程度の簡潔な要約文を生成せよ
      3. 元のテキストの意図や文脈を正確に保持せよ
      4. 冗長な表現を避け、明確で理解しやすい日本語を使用せよ
      5. 箇条書きではなく、自然な文章形式で記述せよ

      # 例
      テキスト：2025年版の機械学習入門：基本概念から実践までを丁寧に解説。Pythonでの実装例も掲載
      要約：2025年版の機械学習入門は、基本概念と実践（Python実装例）を丁寧に解説する。

      
      テキスト：{context_str} 
      要約:
    
    jp_insert_prompt_tmpl: |
      【既存の要約情報】
      以下に、1から{num_chunk}までの番号付きリストで既存の要約が提供されています。各番号は特定のコンテキストの要約を表しています。
      --------------------
