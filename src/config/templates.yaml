# Template Prompt Configuration
# テンプレートプロンプトの設定

template_prompts:
  # Simple Input Templates
  simple_input:
    jp_simple_input_tmpl: "{query_str}"
  
  # Text QA Templates
  text_qa:
    system_prompt: |
      あなたは世界中で信頼されている専門のQ&Aシステムです。
      常に提供されたコンテキスト情報のみを用いて質問に回答し、事前の知識は使用しないでください。
      従うべきルール:
      1. 回答内で与えられたコンテキストを直接参照しないでください。
      2. 「コンテキストに基づいて...」や「コンテキスト情報...」のような表現を避けてください。
    
    user_prompt: |
      以下にコンテキスト情報を示します。
      ---------------------
      {context_str}
      ---------------------
      コンテキスト情報のみを用いて質問に回答してください（事前知識は使用しないでください）。
      質問: {query_str}
      回答: 
    
    jp_text_qa_tmpl: |
      以下のコンテキスト情報を使用して質問に回答してください。
      
      【コンテキスト】
      {context_str}
      
      【回答要件】
      - コンテキストの情報のみを使用する
      - 事実に基づいた正確な回答をする
      - 回答できない場合は明記する
      - 具体的かつ詳細に記述する
      
      質問: {query_str}
      回答: 

  # Tree Summarize Templates
  tree_summarize:
    user_prompt: |
      複数のソースからのコンテキスト情報を以下に示します。
      ---------------------
      {context_str}
      ---------------------
      複数の情報を踏まえて（事前知識は使用せずに）質問に回答してください。
      質問: {query_str}
      回答: 
    
    jp_tree_summarize_tmpl: |
      以下のコンテキスト情報は、複数の情報源から収集された内容です。
      ---------------------
      {context_str}
      ---------------------
      上記の情報を使用して、以下の質問に対する包括的で統合された回答を提供してください。
      質問: {query_str}

      回答を作成する際は以下の点に注意してください:
      1. 複数の情報源から得られた情報を論理的に統合すること
      2. 重複する情報は一度だけ記載し、簡潔にまとめること
      3. 矛盾する情報がある場合は、その旨を明記し、可能であればその理由を説明すること
      4. 情報の重要度に応じて、適切に優先順位をつけること
      5. 全体として首尾一貫した、理解しやすい回答を構成すること
      6. 必要に応じて、情報を階層的に整理すること(箇条書きや段落分けなど)
      7. 包括的かつ詳細な回答を提供すること
      8. 提供された情報のみに基づき、推測は避けること
      9. 回答は日本語で行うこと

      統合された回答: 

  # Refine Templates
  refine:
    user_prompt: |
      あなたは既存の回答を洗練する際、厳密に次の2つのモードで動作する専門のQ&Aシステムです：
      1. 新しいコンテキストを用いて元の回答を**書き直す**。
      2. 新しいコンテキストが有用でない場合は元の回答を**繰り返す**。
      回答内で元の回答やコンテキストを直接参照しないでください。
      迷ったら元の回答を繰り返してください。
      新しいコンテキスト: {context_msg}
      質問: {query_str}
      元の回答: {existing_answer}
      新しい回答: 
    
    jp_refine_tmpl: |
      元の質問: {query_str}
      既存の回答: {existing_answer}
      新たにコンテキスト情報が与えられました。必要に応じて既存の回答を洗練する必要があります。
      ------------
      {context_msg}
      ------------
      新しいコンテキストを考慮して、元の質問より良い回答を提供してください。
      以下の指針に従ってください:
      1. 新しいコンテキストが既存の回答に関連性がある場合、回答を更新・拡張してください
      2. 新しい情報が既存の回答と矛盾する場合、より正確な情報を優先してください
      3. 新しいコンテキストが既存の回答に追加の詳細や証拠を提供する場合、それを統合してください
      4. 新しいコンテキストが有用でない場合は、元の回答をそのまま繰り返してください
      5. 回答全体の一貫性と読みやすさを保つこと
      6. 可能な限り包括的で詳細な回答を目指すこと
      7. 回答は日本語で行うこと

      改善された回答: 

  # Refine Table Context Templates
  refine_table_context:
    user_prompt: |
      以下にテーブルのスキーマを示します。
      ---------------------
      {schema}
      ---------------------
      さらにコンテキスト情報を以下に示します。{context_msg}
      ---------------------
      テーブルのスキーマとコンテキスト情報を用いて元の回答を改善してください。
      コンテキストが有用でない場合は元の回答を返してください。
    
    jp_refine_table_context_tmpl: |
      以下にテーブルのスキーマを示します。
      ---------------------
      {schema}
      ---------------------
      さらにコンテキスト情報を以下に示します。{context_msg}
      ---------------------
      テーブルのスキーマとコンテキスト情報を用いて次のタスクに対する回答を作成してください: {query_str}
      既に提供されている回答: {existing_answer}
      新しいコンテキストを踏まえて、元の回答をより良くするように改善してください。
      コンテキストが有用でない場合は元の回答を返してください。

  # Selection Templates
  selection:
    jp_single_select_tmpl: |
      以下に候補が番号付きリスト（1〜{num_choices}）で示されています。各項目はサマリーに対応します。
      ---------------------
      {context_list}
      ---------------------
      上記の選択肢のみを用い、事前の知識は使わずに、質問'{query_str}'に最も関連する選択肢を返してください。
    
    jp_multi_select_tmpl: |
      以下に候補が番号付きリスト（1〜{num_choices}）で示されています。各項目はサマリーに対応します。
      ---------------------
      {context_list}
      ---------------------
      上記の選択肢のみを用い、事前の知識は使わず、質問'{query_str}'に最も関連する上位の選択肢を返してください（最大で{max_outputs}件まで、必要な分だけ選んでください）。

  # Extractor Templates
  extractor:
    jp_title_node_template_tmpl: |
      あなたは与えられた日本語テキストから「最適なタイトル」を抽出・生成するモデルです。
      以下のルールに厳密に従ってください。

      # ルール
      1. 日本語のタイトル1文のみを返せ
      2. タイトルは「タイトル文字列のみ」にしろ。説明や補足、改行、注釈は一切付けるな
      3. 文字数上限は30文字(必要なら変更可)
      4. 固有名詞・日付・数字は可能な限り保持しろ
      5. 入力が短くタイトルとして十分なら、そのまま返せ
      6. 「タイトル：」は前後に付けるな
      # 例1
      テキスト：2025年版の機械学習入門：基本概念から実践までを丁寧に解説。Pythonでの実装例も掲載。
      タイトル：機械学習入門


      このルールに厳密に従って、以下のテキストから適切なタイトルを生成してください。
      
      テキスト：{context_str}
      タイトル：
    
    jp_title_combine_template_tmpl: |
      あなたは複数の文書タイトルを分析し、その本質を捉えた統合タイトルを生成する専門家です。
      以下のルールに厳密に従ってください。

      # ルール
      1. 日本語のタイトル1文を返すせよ
      2. 出力は「タイトル文字列のみ」にせよ。説明や補足、改行、注釈は一切付けるな
      3. 文字数上限は30文字(必要なら変更可)。上限を超える場合は重要語を優先して短縮せよ
      4. テキストの主要なトピックや主題を簡潔に表現せよ
      5. 日本語として自然で読みやすい表現にせよ
      6. 専門用語・固有名詞・日付・数字は必ず保持しろ
      7. 「について」「に関する」のような冗長な表現は避けろ
      8. 「統合タイトル：」は前後に付けるな
      # 例1 
      タイトル一覧：
      - Pythonによるデータ分析の基礎
      - pandas入門ガイド
      - NumPyを使った数値計算
      統合タイトル：Pythonデータ分析ツールの基礎
      

      以下のタイトル一覧は、関連するトピックをカバーする複数の文書のタイトルです。
      このルールに厳密に従って、タイトル一覧を統合し、全体を代表する1つのタイトルを生成してください。

      タイトル一覧：{context_str}
      統合タイトル：
    
    jp_summary_extract_template_tmpl: |
      あなたは日本語テキストを簡潔かつ正確に要約するモデルです。
      以下のルールに厳密に従ってください。

      # ルール
      1. 出力は「要約のみ」にする。説明や補足、改行、注釈は一切付けない
      2. 長さは「1～3文(300文字)」。
      3. 固有名詞、日付、数字、重要な事実は可能な限り保持すること
      4. 主観的評価、推測、未確認情報の追加は禁止。テキストにない事実を付け加えない
      5. テキストが短く要約が不要な場合はテキストをそのまま返す
      6. 日本語以外が混在する場合でも、日本語で完結に要約すること
      7. 「要約：」を前後に付けないこと
      # 例1
      テキスト：2025年版の機械学習入門：基本概念から実践までを丁寧に解説。Pythonでの実装例も掲載
      要約：2025年版の機械学習入門は、基本概念と実践（Python実装例）を丁寧に解説する。
      
      
      このルールに厳密に従って、テキストから要約文を生成してください。
      
      テキスト：{context_str}
      要約：
    
    jp_keyword_extract_template_tmpl: |
      あなたは与えられた日本語テキストから「重要キーワード」を抽出し、半角カンマで区切って返すモデルです。
      
      # ルール
      1. 出力は「キーワードのみ」を半角カンマ区切りで返す。説明や補足、改行、注釈は一切付けない
      2. 最大{keywords}個まで。
      3. 助詞、接続詞、一般的な補助語は除外すること
      4. 固有名詞・日付・数字はできる限り保持すること
      5. テキストが短くキーワードが1つしかない場合はその1つだけ返すこと
      6. カンマ区切りで出力する（例: k1,k2,k3）
      7. 「キーワード：」を前後に付けないこと
      # 例1
      テキスト：2025年版 機械学習入門:基本概念とPython実装のハンズオン
      キーワード：機械学習,2025,Python,ハンズオン,基本概念

      このルールに厳密に従って、以下のテキストから重要なキーワードを抽出してください。
      
      テキスト：{context_str}
      キーワード：

    jp_question_gen_tmpl: |
      以下のテキストコンテンツから、質問を{num_questions}件生成してください。
      
      【生成要件】
      - このテキストから直接回答できる質問を作成する
      - 具体的で明確な質問にする
      - 事実確認、理由説明、比較などの多様な観点を含める
      - 他の文書では回答しにくい、このテキスト特有の質問にする
      
      【テキストコンテンツ】
      {context_str}
      
      【出力形式】
      1. <質問文>
      2. <質問文>
      3. <質問文>

  # Evaluation Templates
  evaluation:
    jp_question_generation_prompt: |
      以下のコンテキストから質問を生成してください。
      
      【コンテキスト】
      {context_str}
      
      【生成要件】
      - コンテキストから直接回答できる質問を作成する
      - 具体的で明確な表現を使用する
      - 事実確認、理由説明、比較、評価など多様な観点を含める
      - 外部知識を必要としない質問にする
      
      【出力指示】
      質問:{query_str}
    
    jp_question_gen_query: |
      与えられた文書から理解度を測るための質問を3個生成してください。
      
      【生成要件】
      - コンテキストに含まれる具体的な情報に基づく
      - コンテキストから直接回答できる質問である
      - 明確で曖昧さのない表現を使用する
      - 外部知識を必要としない
      - 事実確認、理由説明、比較、評価など多様な観点を含める
      
      【出力形式】
      1.<質問文>
      2.<質問文>
      3.<質問文>
    
    jp_eval_template_tmpl: |
      以下の情報がコンテキストによって支持されているかを判断してください。
      
      【判断基準】
      - コンテキストに情報の根拠が含まれている場合は YES
      - コンテキストに情報の根拠が含まれていない場合は NO
      - コンテキストの一部でも情報を支持していれば YES
      - 大部分が無関係でも、一部が支持していれば YES
      
      【評価対象の情報】
      {query_str}
      
      【コンテキスト】
      {context_str}
      
      【出力形式】
      YES または NO のいずれかで回答してください。
      
      回答: 

    jp_refine_template_tmpl: |
      既存の評価結果を、追加コンテキストを用いて更新してください。
      
      【評価対象の情報】
      {query_str}
      
      【既存の評価結果】
      {existing_answer}
      
      【追加コンテキスト】
      {context_msg}
      
      【更新基準】
      - 既存評価が YES の場合は YES を維持する
      - 追加コンテキストに情報の根拠があれば YES
      - 追加コンテキストに情報の根拠がなければ既存評価を維持
      - 矛盾がある場合は追加コンテキストを優先する
      
      【出力形式】
      YES または NO のいずれかで回答してください。
      
      更新後の回答: 
    
    jp_summary_query: |
      このドキュメントの主要な内容、テーマ、目的について教えてください。
      また、このドキュメントが答えることができる質問や、含まれている重要な情報についても詳述してください。
    
    jp_summary_query_tech: |
      この文書について、以下の観点から詳細な要約を提供してください:

      - **技術概要**: 説明されている技術、システム、手法の概要
      - **アーキテクチャと設計**: システム構成、設計原則、技術スタック
      - **実装の詳細**: 主要な実装方法、アルゴリズム、コード構造
      - **技術仕様**: パラメータ、設定、要件、制約事項
      - **使用方法と手順**: セットアップ、設定、操作の方法
      - **トラブルシューティング**: よくある質問とその解決方法
      - **回答可能な技術的質問**: この文書が答えることができる具体的な技術的問い
      - **前提知識と依存関係**: 理解に必要な背景知識や関連技術
    
    jp_summary_prompt_tmpl: |
      以下の情報の要約を作成してください。提供された情報のみを使用するようにしてください。
      できるだけ多くの重要な詳細を含めてください。
      
      
      {context_str}
      
      
      要約:"""
    
    jp_insert_prompt_tmpl: |
      【既存の要約情報】
      以下に、1から{num_chunk}までの番号付きリストで既存の要約が提供されています。各番号は特定のコンテキストの要約を表しています。
      --------------------
      {context_str}
      --------------------

      【新しい情報】
      {new_chunk_text}

      【タスク】
      上記の新しい情報を既存の要約構造に統合する必要があります。以下の基準に基づいて、更新すべき要約の番号を選択してください
      【選択基準】
      1. 内容の関連性: 新しい情報が既存の要約のトピックと最も密接に関連しているか
      2. テーマの一貫性: 新しい情報が既存の要約のテーマと整合性があるか
      3. 情報の補完性: 新しい情報が既存の要約を補完または拡張するか
      4. コンテキストの適合性: 新しい情報が既存の要約のコンテキスト内で意味を持つか

      【回答形式】
      最も関連性の高い要約に対応する番号のみを回答してください(数字のみ)
    
