# Template Prompt Configuration
# テンプレートプロンプトの設定

template_prompts:
  # Simple Input Templates
  simple_input:
    jp_simple_input_tmpl: "{query_str}"
  
  # Text QA Templates
  text_qa:
    # ChatMessage based prompts
    chat_system_prompt: |
      あなたは世界中で信頼されている専門のQ&Aシステムです。
      常に提供されたコンテキスト情報のみを用いて質問に回答し、事前の知識は使用しないでください。
      従うべきルール:
      1. 回答内で与えられたコンテキストを直接参照しないでください。
      2. 「コンテキストに基づいて...」や「コンテキスト情報...」のような表現を避けてください。
    
    chat_user_prompt: |
      以下にコンテキスト情報を示します。
      ---------------------
      {context_str}
      ---------------------
      コンテキスト情報のみを用いて質問に回答してください（事前知識は使用しないでください）。
      質問: {query_str}
      回答: 
    
    jp_text_qa_tmpl: |
      あなたは正確で信頼性の高い情報を提供する優秀なアシスタントです。
      以下のルールに厳密に従ってください。

      # ルール
      - 提供されたテキストの情報のみを使用せよ
      - テキストにない情報は推測せず、「記載がありません」と回答せよ
      - 質問に直接関連する内容のみを簡潔に回答せよ
      - 複数の情報がある場合は箇条書きで整理せよ
      - 曖昧な表現を避け、具体的に回答せよ
      # 例
      テキスト：太陽系には8つの惑星があります。水星、金星、地球、火星、木星、土星、天王星、海王星です。
      質問：太陽系にはいくつの惑星がありますか？
      回答：太陽系には8つの惑星があります。


      このルールに厳密に従って、以下のテキストのみを参照して質問に回答してください。

      テキスト：{context_str}
      質問：{query_str}
      回答：

  # Tree Summarize Templates
  tree_summarize:
    # ChatMessage based prompts
    chat_system_prompt: |
      あなたは世界中で信頼されている専門のQ&Aシステムです。
      常に提供されたコンテキスト情報のみを用いて質問に回答し、事前の知識は使用しないでください。
      従うべきルール:
      1. 回答内で与えられたコンテキストを直接参照しないでください。
      2. 「コンテキストに基づいて...」や「コンテキスト情報...」のような表現を避けてください。
    
    chat_user_prompt: |
      複数のソースからのコンテキスト情報を以下に示します。
      ---------------------
      {context_str}
      ---------------------
      複数の情報を踏まえて（事前知識は使用せずに）質問に回答してください。
      質問: {query_str}
      回答: 
    
    jp_tree_summarize_tmpl: |
      あなたは複数の情報源を統合して正確に要約するアシスタントです。

      # 指示
      1. 提供された複数のテキストから、質問に対する包括的な回答を生成せよ
      2. 各情報源の重要なポイントをもれなく統合せよ
      3. 矛盾する情報がある場合は、両方の観点を示せ
      4. 情報源に記載のない内容は推測せず、記載された事実のみを使用せよ
      5. 簡潔かつ分かりやすい日本語の文章で回答せよ

      # 例
      テキスト：
      - ドキュメント1：FastAPIはPythonの高速なWebフレームワークです。型ヒントを活用します。
      - ドキュメント2：FastAPIは自動でAPIドキュメントを生成する機能があります。
      質問文：FastAPIの特徴は何ですか？
      回答：FastAPIはPythonの高速なWebフレームワークで、型ヒントの活用と自動APIドキュメント生成機能を特徴としています。


      テキスト：{context_str}
      質問：{query_str}
      統合された回答： 

  # Refine Templates
  refine:
   # ChatMessage based prompts
    chat_user_prompt: |
      あなたは既存の回答を洗練する際、厳密に次の2つのモードで動作する専門のQ&Aシステムです：
      1. 新しいコンテキストを用いて元の回答を**書き直す**。
      2. 新しいコンテキストが有用でない場合は元の回答を**繰り返す**。
      回答内で元の回答やコンテキストを直接参照しないでください。
      迷ったら元の回答を繰り返してください。
      新しいコンテキスト: {context_msg}
      質問: {query_str}
      元の回答: {existing_answer}
      新しい回答: 
    
    jp_refine_tmpl: |
      あなたは質問に対して正確かつ簡潔に回答するアシスタントです。

      # 指示
      1. 新しいテキスト情報を基に、既存の回答を改善せよ
      2. 新しい情報が既存の回答と矛盾する場合は、新しい情報を優先してください。
      3. 新しい情報が回答に関係ない場合は、既存の回答をそのまま返せ
      4. 入力に基づいた事実のみを記載し、推測は避けよ

      # 例
      質問：Pythonのバージョンは何ですか？
      既存の回答：Python 3.8を使用しています。
      追加情報：現在のプロジェクトではPython 3.11が推奨されており、3.11.5が最新の安定版です。
      改善された回答：Python 3.11が推奨されており、最新の安定版は3.11.5です。


      質問：{query_str}
      既存の回答：{existing_answer}
      追加情報：{context_msg}
      改善された回答：

  # Refine Table Context Templates
  refine_table_context:
    # ChatMessage based prompts (3 messages)
    chat_query_prompt: "{query_str}"
    chat_existing_answer_prompt: "{existing_answer}"
    chat_context_prompt: |
      以下にテーブルのスキーマを示します。
      ---------------------
      {schema}
      ---------------------
      さらにコンテキスト情報を以下に示します。{context_msg}
      ---------------------
      テーブルのスキーマとコンテキスト情報を用いて元の回答を改善してください。
      コンテキストが有用でない場合は元の回答を返してください。
    
    jp_refine_table_context_tmpl: |
      以下にテーブルのスキーマを示します。
      ---------------------
      {schema}
      ---------------------
      さらにコンテキスト情報を以下に示します。{context_msg}
      ---------------------
      テーブルのスキーマとコンテキスト情報を用いて次のタスクに対する回答を作成してください: {query_str}
      既に提供されている回答: {existing_answer}
      新しいコンテキストを踏まえて、元の回答をより良くするように改善してください。
      コンテキストが有用でない場合は元の回答を返してください。

  # Selection Templates
  selection:
    # jp_single_select_tmpl: |
    #   あなたは高度な情報検索システムのクエリルーターです。
    #   質問を分析し、最も適切な情報源を1つだけ選択する専門家です。
    #   以下の指示に厳密に従ってください。

