# LLMモデル設定ファイル
# 複数のLLMとそのパラメータを定義

llm_config_models:
  # Ollama系 (ローカル推論)
  ollama_qwen3_32b:
    backend: "ollama"
    model_name: "qwen3:32b"
    base_url: "http://ollama:11434"
    kwargs:
      thinking: true
      temperature: 0.0
      request_timeout: 3600
 
    
  # vLLM (GPU推論サーバー)
  vllm_qwen3_32b_awq:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-32B-AWQ"
    base_url: "http://vllm-llm:8000/v1"
    kwargs:
      temperature: 0.0
      max_tokens: 1024
      timeout: 3600

  vllm_qwen3_vl_30b:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-VL-30B-A3B-Instruct"
    base_url: "http://vllm-llm:8000/v1"
    kwargs:
      temperature: 0.0
      # max_tokens: 1024
      timeout: 3600

