# LLMモデル設定ファイル
# 複数のLLMとそのパラメータを定義

llm_config_models:
  # Ollama系 (ローカル推論)
  ollama_qwen3_32b:
    backend: "ollama"
    model_name: "qwen3:32b"
    base_url: "http://ollama:11434"
 
  # vLLM (GPU推論サーバー)
  vllm_qwen3_32b_awq:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-32B-AWQ"
    base_url: "http://vllm-llm:8000/v1"

  vllm_qwen3_vl_30b:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-VL-30B-A3B-Instruct"
    base_url: "http://vllm-llm:8000/v1"
  
  vllm_elyza_8b:
    backend: "vllm"
    model_name: "/models/Llama-3-ELYZA-JP-8B"
    base_url: "http://vllm-llm:8000/v1"

  vllm_elyza_8b_awq:
    backend: "vllm"
    model_name: "/models/Llama-3-ELYZA-JP-8B-AWQ"
    base_url: "http://vllm-llm:8000/v1"


domain_kwargs_models:
  vllm_title:
    temperature: 0.0
    max_tokens: 100
    timeout: 180
    additional_kwargs:
      frequency_penalty: 1.0
      stop: ["\n"]

  vllm_summary:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      frequency_penalty: 1.0
  
  vllm_keywords:
    temperature: 0.0
    max_tokens: 256
    timeout: 180
    additional_kwargs:
      frequency_penalty: 1.0
      stop: ["\n"]
