# LLMモデル設定ファイル
# 複数のLLMとそのパラメータを定義

llm_config_models:
  # Ollama系 (ローカル推論)
  ollama_qwen3_8b:
    backend: "ollama"
    model_name: "qwen3:8b"
    base_url: "http://ollama:11434"
 
  # vLLM (GPU推論サーバー)
  vllm_qwen3_32b_awq:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-32B-AWQ"
    base_url: "http://vllm-llm:8000/v1"

  vllm_qwen3_vl_30b:
    backend: "vllm"
    model_name: "/models/Qwen/Qwen3-VL-30B-A3B-Instruct"
    base_url: "http://vllm-llm:8000/v1"
  
  vllm_elyza_8b:
    backend: "vllm"
    model_name: "/models/Llama-3-ELYZA-JP-8B"
    base_url: "http://vllm-llm:8000/v1"

  vllm_elyza_8b_awq:
    backend: "vllm"
    model_name: "/models/Llama-3-ELYZA-JP-8B-AWQ"
    base_url: "http://vllm-llm:8000/v1"


# LlamaIndexの各クラス・用途ごとのLLM制御設定
domain_kwargs_models:
  # ==========================================
  # メタデータ抽出系（Extractors）
  # ==========================================
  
  # TitleExtractor - タイトル生成（短く簡潔に）
  extractor_title:
    temperature: 0.0
    max_tokens: 100
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0  # 繰り返し抑制
      frequency_penalty: 1.0  # 頻出抑制
      stop: ["\n"]  # 改行で停止
  
  # SummaryExtractor - 要約生成（適度な長さ）
  extractor_summary:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0
      frequency_penalty: 1.0
  
  # KeywordExtractor - キーワード抽出（短く）
  extractor_keyword:
    temperature: 0.0
    max_tokens: 256
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0
      frequency_penalty: 1.0
      stop: ["\n"]
  
  # QuestionsAnsweredExtractor - 質問生成
  extractor_qa:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 1.0
      frequency_penalty: 1.0

  # ==========================================
  # クエリエンジン・Selector系
  # ==========================================
  
  # LLMSingleSelector / LLMMultiSelector - ツール選択（確定的）
  selector:
    temperature: 0.0
    max_tokens: 256
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0  # 選択タスクは繰り返しペナルティ不要
      frequency_penalty: 0.0
      stop: ["\n"]
  
  # ==========================================
  # Response Synthesizer系
  # ==========================================
  
  # ResponseSynthesizer - 回答生成（標準）
  synthesizer_response:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0
  
  # TreeSummarize - 階層的要約
  synthesizer_tree_summarize:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.5  # 軽い繰り返し抑制
      frequency_penalty: 0.5
  
  # Refine - 段階的改善
  synthesizer_refine:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.3
      frequency_penalty: 0.3

  # ==========================================
  # Query Transformation系
  # ==========================================
  
  # Query Rewrite/Transform - クエリ変換
  query_transform:
    temperature: 0.1
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.5
      frequency_penalty: 0.5

  # ==========================================
  # Agent系
  # ==========================================
  
  # ReActAgent - 推論＋行動
  agent_react:
    temperature: 0.0
    max_tokens: 2048
    timeout: 300
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0
  
  # FunctionAgent - 関数呼び出し
  agent_function:
    temperature: 0.0
    max_tokens: 2048
    timeout: 300
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0

  # ==========================================
  # Evaluation系
  # ==========================================
  
  # FaithfulnessEvaluator - 忠実性評価
  evaluator_faithfulness:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0
  
  # RelevancyEvaluator - 関連性評価
  evaluator_relevancy:
    temperature: 0.0
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0
  
  # CorrectnessEvaluator - 正確性評価
  evaluator_correctness:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0

  # ==========================================
  # Dataset Generation系
  # ==========================================
  
  # RagDatasetGenerator - 質問生成
  dataset_question_gen:
    temperature: 0.3
    max_tokens: 512
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.8  # 多様性を確保
      frequency_penalty: 0.8
  
  # RagDatasetGenerator - 回答生成
  dataset_answer_gen:
    temperature: 0.0
    max_tokens: 1024
    timeout: 180
    additional_kwargs:
      presence_penalty: 0.0
      frequency_penalty: 0.0
