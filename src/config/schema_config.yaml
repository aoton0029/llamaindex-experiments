    max_length: 256
    description: "Unique identifier for the document"
  - name: "doc_id"
    dtype: "VARCHAR"
    max_length: 256
    description: "Document identifier"
  - name: "_node_type"
    dtype: "VARCHAR"
    max_length: 128
    description: "Type of the node"
  - name: "_node_content"
    dtype: "VARCHAR"
    max_length: 65535
    description: "Content of the node"
  - name: "ref_doc_id"
    dtype: "VARCHAR"
    max_length: 256
    description: "Reference document identifier"
  # 追加メタデータ
  # - name: "title"
  #   dtype: "VARCHAR"
