# Prompt Helper Configuration
# プロンプトヘルパーの設定
# LLMへの入力サイズを管理するための設定

prompt_helper_config_models:
  default:
    context_window: 4096
    num_output: 512
    chunk_overlap_ratio: 0.1
    chunk_size_limit: null
    separator: " "
  
  large_context:
    context_window: 8192
    num_output: 1024
    chunk_overlap_ratio: 0.1
    chunk_size_limit: null
    separator: " "
  
  small_context:
    context_window: 2048
    num_output: 256
    chunk_overlap_ratio: 0.1
    chunk_size_limit: null
    separator: " "
  
  gpt4:
    context_window: 8192
    num_output: 2048
    chunk_overlap_ratio: 0.1
    chunk_size_limit: null
    separator: " "
  
  gpt35:
    context_window: 4096
    num_output: 512
    chunk_overlap_ratio: 0.1
    chunk_size_limit: null
    separator: " "
  
  claude:
    context_window: 100000
    num_output: 4096
    chunk_overlap_ratio: 0.1
    chunk_size_limit: null
    separator: " "
  
  local_llm:
    context_window: 4096
    num_output: 512
    chunk_overlap_ratio: 0.1
    chunk_size_limit: null
    separator: " "
