# テストパターン設定ファイル
# 実験で試行する組み合わせパターンを定義

vector_001:
  enabled: true
  name: "VectorDB_RAG_with_TokenChunking_and_OllamaQwen3"
  description: "ベクトルDB RAG - トークンチャンキング + Ollama Qwen3埋め込み + Ollama Qwen3 LLM"
  tokenizer_config_model:
    type: "huggingface_ruri_v3_310m"
  embedding_config_model: 
    type: "ollama_qwen3"
  llm_config_model: 
    type: "ollama_qwen3_32b"
  indexing_strategy:
    - chunking_config_model: "token_based_small"
      indexing_config_model: "vector"
    - chunking_config_model: "token_based_middle"
      indexing_config_model: "summary"
    - chunking_config_model: "token_based_large"
      indexing_config_model: "document_summary"
  evaluation_strategy:
    type: "llamaindex_basic"