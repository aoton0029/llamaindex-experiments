# エクストラクタテストパターン

# テストパターン1: 基本的なチャンキング + タイトルのみ
test_basic_title:
  enabled: true
  name: "基本チャンキング + タイトル抽出"
  description: "SentenceSplitterで分割してタイトルのみ抽出"
  tokenizer_config_model:
    type: "hf_elyza_8b_awq"
  embedding_config_model:
    type: "ollama_qwen3"
  llm_config_model:
    type: "vllm_elyza_8b"
  chunking_config_model:
    type: "sentence_splitter"
  extractor_pattern:
    type: "pattern_title_only"

# テストパターン2: 基本的なチャンキング + タイトル + キーワード
test_basic_title_keyword:
  enabled: true
  name: "基本チャンキング + タイトル + キーワード"
  description: "SentenceSplitterで分割してタイトルとキーワードを抽出"
  tokenizer_config_model:
    type: "hf_elyza_8b_awq"
  embedding_config_model:
    type: "ollama_qwen3"
  llm_config_model:
    type: "vllm_elyza_8b"
  chunking_config_model:
    type: "sentence_splitter"
  extractor_pattern:
    type: "pattern_title_keyword"

# テストパターン3: 基本的なチャンキング + フルエクストラクタ
test_basic_full:
  enabled: true
  name: "基本チャンキング + フルエクストラクタ"
  description: "SentenceSplitterで分割して全てのエクストラクタを適用"
  tokenizer_config_model:
    type: "hf_elyza_8b_awq"
  embedding_config_model:
    type: "ollama_qwen3"
  llm_config_model:
    type: "vllm_elyza_8b"
  chunking_config_model:
    type: "sentence_splitter"
  extractor_pattern:
    type: "pattern_full"

# テストパターン4: セマンティックチャンキング + サマリー + キーワード
test_semantic_summary_keyword:
  enabled: true
  name: "セマンティックチャンキング + サマリー + キーワード"
  description: "SemanticSplitterで分割してサマリーとキーワードを抽出"
  tokenizer_config_model:
    type: "hf_elyza_8b_awq"
  embedding_config_model:
    type: "ollama_qwen3"
  llm_config_model:
    type: "ollama_qwen3_32b"
  chunking_config_model:
    type: "semantic_splitter"
  extractor_pattern:
    type: "pattern_summary_keyword"

# テストパターン5: 階層的チャンキング + 質問重視
test_hierarchical_questions:
  enabled: true
  name: "階層的チャンキング + 質問重視"
  description: "HierarchicalNodeParserで分割して質問生成を重視"
  tokenizer_config_model:
    type: "hf_elyza_8b_awq"
  embedding_config_model:
    type: "ollama_qwen3"
  llm_config_model:
    type: "ollama_qwen3_32b"
  chunking_config_model:
    type: "hierarchical_node_parser"
  extractor_pattern:
    type: "pattern_questions_focus"

# テストパターン6: トークンベースチャンキング + タイトル + サマリー
test_token_title_summary:
  enabled: true
  name: "トークンベースチャンキング + タイトル + サマリー"
  description: "TokenTextSplitterで分割してタイトルとサマリーを抽出"
  tokenizer_config_model:
    type: "hf_elyza_8b_awq"
  embedding_config_model:
    type: "ollama_qwen3"
  llm_config_model:
    type: "ollama_qwen3_32b"
  chunking_config_model:
    type: "token_text_splitter"
  extractor_pattern:
    type: "pattern_title_summary"
