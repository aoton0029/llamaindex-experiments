services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      # - ETCD_HEARTBEAT_INTERVAL=100
      # - ETCD_ELECTION_TIMEOUT=1000
    volumes:
      - etcd_storage:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3


  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_storage:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3


  milvus:
    container_name: milvus
    image: milvusdb/milvus:v2.6.1
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_storage:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy


  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${COMMON_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${COMMON_PASSWORD}
    volumes:
      - mongodb_storage:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${COMMON_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${COMMON_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${COMMON_USERNAME}:${COMMON_PASSWORD}@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${COMMON_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${COMMON_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy


  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${COMMON_PASSWORD}
    volumes:
      - redis_storage:/data
      - ./volumes/redis/conf:/usr/local/etc/redis
    command: >
      sh -c "
        if [ -n \"${COMMON_PASSWORD}\" ]; then
          redis-server --appendonly yes --requirepass ${COMMON_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
        else
          redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      "
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "5430:5430"
    volumes:
      - redisinsight_storage:/db
    depends_on:
      redis:
        condition: service_healthy


  neo4j:
    image: neo4j:2025.08.0-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/p@ssw0rd
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_storage:/data
      - ./volumes/neo4j/plugins:/plugins
      - ./volumes/neo4j/import:/var/lib/neo4j/import
      - ./volumes/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${COMMON_PASSWORD} 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ollama:
  #   image: ollama/ollama:0.12.3
  #   container_name: ollama
  #   restart: unless-stopped
  #   ipc: host
  #   shm_size: "4g"
  #   ports:
  #     - 11434:11434
  #   volumes:
  #     - ollama_storage:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ipc: host
    shm_size: "4g"
    command: >
      --model=Qwen/Qwen3-VL-8B-Instruct
      --tokenizer=Qwen/Qwen3-VL-8B-Instruct
      --dtype=auto
      --tensor-parallel-size=1
      --max-model-len=8192   
      --download-dir=/models
      --host=0.0.0.0
      --port=8000
      --gpu-memory-utilization=0.6
    environment:
      - VLLM_USE_V1=1
      - DISABLE_CUSTOM_ALL_REDUCE=1
      - NVIDIA_VISIBLE_DEVICES=0,1
    volumes:
      - ./volumes/vllm/models:/models
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  default:
    name: llamaindex_store_network
      
volumes:
  etcd_storage:
  minio_storage:
  milvus_storage:
  neo4j_storage:
  redis_storage:
  mongodb_storage:
  ollama_storage:
  redisinsight_storage: