services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ipc: host
    shm_size: "4g"
    command: >
      --model=/models/Llama-3-ELYZA-JP-8B-AWQ
      --tokenizer=/models/Llama-3-ELYZA-JP-8B-AWQ
      --dtype=auto
      --tensor-parallel-size=1
      --max-model-len=4096
      --download-dir=/models
      --host=0.0.0.0
      --port=8000
      --gpu-memory-utilization=0.6
      --quantization=awq
    environment:
      - VLLM_USE_V1=1
      - DISABLE_CUSTOM_ALL_REDUCE=1
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ./llm_models:/models
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - vllm-network

networks:
  vllm-network:
    name: vllm-network
    driver: bridge

